name: Reusable workflow to deploy Docker image on AWS EC2 instance

on:
  workflow_call:
    inputs:
      gha-role-name:
        description: 'Name of the IAM Role to assume in the AWS Management Account'
        required: true
        type: string
      ecr-repo:
        description: 'name of the ECR repository'
        required: true
        type: string
      ecr-repo-aws-region:
        description: 'AWS Region for ECR Repository'
        required: true
        type: string
      aws-secret-name:
        description: 'Name of the secret in AWS Secrets Manager'
        required: true
        type: string
      composefile-path:
        description: 'Path to the docker-compose.yml file'
        required: true
        type: string
      secret-file-map:
        description: 'Optional JSON object mapping secret keys to relative paths below .runtime-secrets'
        required: false
        default: '{}'
        type: string
      rsa-keypair-file-map:
        description: 'Optional JSON object mapping RSA private-key paths to matching public-key paths below .runtime-secrets'
        required: false
        default: '{}'
        type: string
      isMainnet:
        description: 'Whether we are deploying to mainnet'
        required: true
        type: boolean
      isDapp:
        description: 'Whether we are deploying to dapp'
        type: boolean
    secrets:
      EC2_SSH_KEY:
        description: 'Private SSH key for dev/testnet EC2 instances'
        required: true
      EC2_USER:
        description: 'SSH user for dev/testnet EC2 instances'
        required: true
      EC2_HOST:
        description: 'Optional EC2 host for dev (leave blank for testnet auto-discovery)'
        required: false
      ECR_REGISTRY:
        description: 'ECR registry URI'
        required: true


env:
  AWS_ROLE_ARN: "arn:aws:iam::471112752664:role/GitHubAction-AssumeRoleWithAction"
  TESTNET_AWS_ROLE_ARN: "arn:aws:iam::381492270411:role/GitHubActionsOIDCRole"
  OTTER_AWS_ROLE_ARN: "arn:aws:iam::381492075531:role/GitHubActionsOIDCRole"
  AWS_REGION: us-west-1
  AWS_DEFAULT_DEPLOYMENT_PATH: /data/treasurenet
  MAINNET_AWS_DEFAULT_DEPLOYMENT_PATH: /home/ubuntu/treasurenet
  SERVICE_NAME: services
  EC2_HOST_SECRET: ${{ secrets.EC2_HOST }}
  EC2_USER_SECRET: ${{ secrets.EC2_USER }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}


permissions:
  id-token: write       # needed for OIDC federation
  contents: read        # needed for actions/checkout

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup cloudflared
        run: |
          # Add cloudflare gpg key
          sudo mkdir -p --mode=0755 /usr/share/keyrings
          curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg | sudo tee /usr/share/keyrings/cloudflare-main.gpg >/dev/null

          # Add this repo to your apt repositories
          echo 'deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared any main' | sudo tee /etc/apt/sources.list.d/cloudflared.list

          # install cloudflared
          sudo apt-get update && sudo apt-get install cloudflared
        
      - name: Check cloudflared version
        run: cloudflared -v

      - name: "Configure AWS Credentials (Dev/Test)"
        if: ${{ !inputs.isMainnet }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.TESTNET_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: "Configure AWS Credentials (DAPP)"
        if: ${{ inputs.isDapp }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.OTTER_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      - name: "Configure AWS Credentials (Mainnet)"
        if: ${{ inputs.isMainnet }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ env.AWS_REGION }}

      - name: Export AWS credentials to environment
        run: |
          echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID"       >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY" >> $GITHUB_ENV
          echo "AWS_SESSION_TOKEN=$AWS_SESSION_TOKEN"        >> $GITHUB_ENV

      # ——— DEV / TESTNET: set or discover EC2_HOST ———
      - name: Set EC2_HOST from secret (dev)
        if: ${{ !inputs.isMainnet && env.EC2_HOST_SECRET }}
        run: echo "EC2_HOST=${{ env.EC2_HOST_SECRET }}" >> $GITHUB_ENV
      
      - name: Set EC2_USER from secret (dev)
        if: ${{ !inputs.isMainnet && env.EC2_USER_SECRET }}
        run: echo "EC2_USER=${{ env.EC2_USER_SECRET }}" >> $GITHUB_ENV

      - name: Discover EC2_HOST via AWS API (testnet)
        if: ${{ !inputs.isMainnet && !env.EC2_HOST_SECRET }}
        run: |
          public_ip=$(aws ec2 describe-instances \
            --region ${{ inputs.ecr-repo-aws-region }} \
            --filters \
              "Name=tag:Name,Values=${{ env.SERVICE_NAME }}" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[*].Instances[*].PublicIpAddress" \
            --output text)
          echo "EC2_HOST=$public_ip"       >> $GITHUB_ENV
          echo "EC2_USER=ubuntu" >> $GITHUB_ENV

      - name: Get EC2 details from AWS (mainnet)
        if: ${{ inputs.isMainnet }}  
        run: |
          public_dns=$(aws ec2 describe-instances \
            --region ${{ env.AWS_REGION }} \
            --filters "Name=tag:Name,Values=web-service-1-us-west-1" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].PublicDnsName" \
            --output text)
          echo "EC2_HOST=$public_dns" >> $GITHUB_ENV
          echo "EC2_USER=ubuntu" >> $GITHUB_ENV  

      - name: Retrieve application secrets
        env:
          SECRET_FILE_MAP: ${{ inputs.secret-file-map }}
          RSA_KEYPAIR_FILE_MAP: ${{ inputs.rsa-keypair-file-map }}
        run: |
          set -euo pipefail
          umask 077
          secret_json=$(mktemp)
          derived_public_key=$(mktemp)
          configured_public_key=$(mktemp)
          trap 'rm -f "$secret_json" "$derived_public_key" "$configured_public_key" .secret-file-map.json .rsa-keypair-file-map.json' EXIT

          aws secretsmanager get-secret-value \
            --secret-id ${{ inputs.aws-secret-name }} \
            --region ${{ inputs.ecr-repo-aws-region }} \
            --query SecretString --output text > "$secret_json"

          jq -e 'type == "object"' "$secret_json" > /dev/null
          printf '%s' "$SECRET_FILE_MAP" > .secret-file-map.json
          jq -e 'type == "object"' .secret-file-map.json > /dev/null
          mkdir -p .runtime-secrets

          while IFS=$'\t' read -r secret_key relative_path; do
            case "$secret_key" in
              ''|*[!A-Z0-9_]* ) echo "Invalid secret-file-map key" >&2; exit 1 ;;
            esac
            case "$relative_path" in
              ''|/*|*'..'*|*'//' ) echo "Invalid secret-file-map path" >&2; exit 1 ;;
            esac

            mkdir -p ".runtime-secrets/$(dirname "$relative_path")"
            jq -er --arg key "$secret_key" '.[$key] | select(type == "string")' "$secret_json" \
              > ".runtime-secrets/$relative_path"
            chmod 600 ".runtime-secrets/$relative_path"
          done < <(jq -r 'to_entries[] | [.key, .value] | @tsv' .secret-file-map.json)

          printf '%s' "$RSA_KEYPAIR_FILE_MAP" > .rsa-keypair-file-map.json
          jq -e 'type == "object"' .rsa-keypair-file-map.json > /dev/null

          while IFS=$'\t' read -r private_relative_path public_relative_path; do
            case "$private_relative_path" in
              ''|/*|*'..'*|*'//' ) echo "Invalid RSA private-key path" >&2; exit 1 ;;
            esac
            case "$public_relative_path" in
              ''|/*|*'..'*|*'//' ) echo "Invalid RSA public-key path" >&2; exit 1 ;;
            esac

            private_path=".runtime-secrets/$private_relative_path"
            public_path=".runtime-secrets/$public_relative_path"
            if ! openssl rsa -in "$private_path" -check -noout > /dev/null 2>&1; then
              echo "Invalid configured RSA private key" >&2
              exit 1
            fi
            if ! openssl rsa -pubin -in "$public_path" -pubout -out "$configured_public_key" > /dev/null 2>&1; then
              echo "Invalid configured RSA public key" >&2
              exit 1
            fi
            if ! openssl rsa -in "$private_path" -pubout -out "$derived_public_key" > /dev/null 2>&1; then
              echo "Unable to derive configured RSA public key" >&2
              exit 1
            fi
            if ! cmp -s "$derived_public_key" "$configured_public_key"; then
              echo "Configured RSA private and public keys do not form a pair" >&2
              exit 1
            fi
          done < <(jq -r 'to_entries[] | [.key, .value] | @tsv' .rsa-keypair-file-map.json)

          jq -r --slurpfile file_map .secret-file-map.json \
            'to_entries[] | select(.key as $key | ($file_map[0] | has($key) | not)) | "\(.key)=\(.value|tostring)"' \
            "$secret_json" > .env
          chmod 600 .env
          rm -f .secret-file-map.json
          rm -f .rsa-keypair-file-map.json

      # ——— DEV / TESTNET: prepare SSH and deploy ———
      - name: Prepare SSH for dev/testnet
        if: ${{ !inputs.isMainnet }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Deploy to dev/testnet
        if: ${{ !inputs.isMainnet }}
        run: |
          set -euo pipefail
          runtime_secret_stage="/home/${{ env.EC2_USER }}/${{ inputs.ecr-repo }}.runtime-secrets-${{ github.run_id }}-${{ github.run_attempt }}"
          find .runtime-secrets -type f -printf '%P\n' | LC_ALL=C sort > .runtime-secrets.manifest
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{inputs.composefile-path}} ${{ env.EC2_USER  }}@${{ env.EC2_HOST }}:/home/${{ env.EC2_USER  }}/${{ inputs.ecr-repo }}.yml
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no .env ${{ env.EC2_USER  }}@${{ env.EC2_HOST }}:/home/${{ env.EC2_USER  }}/${{ inputs.ecr-repo }}.env
          scp -r -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no .runtime-secrets ${{ env.EC2_USER  }}@${{ env.EC2_HOST }}:"${runtime_secret_stage}"
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no .runtime-secrets.manifest ${{ env.EC2_USER  }}@${{ env.EC2_HOST }}:"${runtime_secret_stage}.manifest"
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            ${{ env.EC2_USER  }}@${{ env.EC2_HOST }} << 'EOF'
            set -euo pipefail
            runtime_secret_stage="/home/${{ env.EC2_USER }}/${{ inputs.ecr-repo }}.runtime-secrets-${{ github.run_id }}-${{ github.run_attempt }}"
            runtime_secret_manifest="${runtime_secret_stage}.manifest"
            test -d "$runtime_secret_stage"
            test ! -e "$runtime_secret_stage/.runtime-secrets"
            find "$runtime_secret_stage" -type f -printf '%P\n' | LC_ALL=C sort > "${runtime_secret_stage}.actual-manifest"
            cmp -s "$runtime_secret_manifest" "${runtime_secret_stage}.actual-manifest"
            rm -f "$runtime_secret_manifest" "${runtime_secret_stage}.actual-manifest"
            mkdir -p ${{ env.AWS_DEFAULT_DEPLOYMENT_PATH }}/${{ inputs.ecr-repo }}
            cd    ${{ env.AWS_DEFAULT_DEPLOYMENT_PATH }}/${{ inputs.ecr-repo }}
            mv /home/ubuntu/${{ inputs.ecr-repo }}.yml ./docker-compose.yml
            mv /home/ubuntu/${{ inputs.ecr-repo }}.env ./.env
            rm -rf ./.runtime-secrets
            mv "$runtime_secret_stage" ./.runtime-secrets
            chmod -R go-rwx ./.runtime-secrets
            sed -i '/image:/s|image:.*|image: ${{ env.ECR_REGISTRY }}/${{ inputs.ecr-repo }}:${{ github.sha }}|' docker-compose.yml
            export AWS_ACCESS_KEY_ID=${{env.AWS_ACCESS_KEY_ID}}
            export AWS_SECRET_ACCESS_KEY=${{env.AWS_SECRET_ACCESS_KEY}}
            export AWS_SESSION_TOKEN=${{env.AWS_SESSION_TOKEN}}
            export AWS_REGION=${{ inputs.ecr-repo-aws-region }}
            export AWS_DEFAULT_REGION=${{ inputs.ecr-repo-aws-region }}
            aws ecr get-login-password --region ${{ inputs.ecr-repo-aws-region }} \
              | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}

            docker-compose down
            docker-compose pull
            docker-compose up -d
          EOF

      # # ——— MAINNET: prepare bastion SSH key ———
      # - name: Prepare SSH for mainnet bastion
      #   if: ${{ inputs.isMainnet }}
      #   run: |
      #     mkdir -p ~/.ssh
      #     echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/bastion_id_rsa
      #     chmod 600 ~/.ssh/bastion_id_rsa

      - name: Configure SSH for Cloudflare Access
        if: ${{ inputs.isMainnet }}
        run: |
          mkdir -p ~/.ssh
          cat >> ~/.ssh/config << 'EOF'
          Host us-west-1-jump-server.treasurenet.io
            ProxyCommand cloudflared access ssh --hostname %h
            User ec2-user
            IdentityFile ~/.ssh/tn-mainnet-gha
            StrictHostKeyChecking no
            ServerAliveInterval 60
            ServerAliveCountMax 3
          EOF
          chmod 600 ~/.ssh/config

      - name: Upload files to bastion host (mainnet)
        if: ${{ inputs.isMainnet }}
        run: |
          set -euo pipefail
          runtime_secret_stage="${{ inputs.ecr-repo }}.runtime-secrets-${{ github.run_id }}-${{ github.run_attempt }}"
          find .runtime-secrets -type f -printf '%P\n' | LC_ALL=C sort > .runtime-secrets.manifest
          scp -o StrictHostKeyChecking=no \
            ${{ inputs.composefile-path }} .env \
            us-west-1-jump-server.treasurenet.io:~/
          scp -r -o StrictHostKeyChecking=no \
            .runtime-secrets \
            us-west-1-jump-server.treasurenet.io:"~/${runtime_secret_stage}"
          scp -o StrictHostKeyChecking=no \
            .runtime-secrets.manifest \
            us-west-1-jump-server.treasurenet.io:"~/${runtime_secret_stage}.manifest"

      - name: Deploy and restart nodes on mainnet
        if: ${{ inputs.isMainnet }}
        run: |
          set -euo pipefail
          ssh us-west-1-jump-server.treasurenet.io << 'OUTER_EOF'
          set -euo pipefail
          runtime_secret_stage="${{ inputs.ecr-repo }}.runtime-secrets-${{ github.run_id }}-${{ github.run_attempt }}"
            # copy compose + env into target instance
          scp -o StrictHostKeyChecking=no \
            -i ~/mainnet-nodes-us-west-1.pem \
            ${{ inputs.composefile-path }} ubuntu@${{ env.EC2_HOST }}:/home/ubuntu/${{ inputs.ecr-repo }}.yml

          scp -o StrictHostKeyChecking=no \
            -i ~/mainnet-nodes-us-west-1.pem \
            .env ubuntu@${{ env.EC2_HOST }}:/home/ubuntu/${{ inputs.ecr-repo }}.env

          scp -r -o StrictHostKeyChecking=no \
            -i ~/mainnet-nodes-us-west-1.pem \
            "$runtime_secret_stage" ubuntu@${{ env.EC2_HOST }}:/home/ubuntu/"$runtime_secret_stage"

          scp -o StrictHostKeyChecking=no \
            -i ~/mainnet-nodes-us-west-1.pem \
            "${runtime_secret_stage}.manifest" ubuntu@${{ env.EC2_HOST }}:/home/ubuntu/"${runtime_secret_stage}.manifest"

          rm -rf "$runtime_secret_stage" "${runtime_secret_stage}.manifest"

            # login and deploy
          ssh -o StrictHostKeyChecking=no \
            -i ~/mainnet-nodes-us-west-1.pem \
            ubuntu@${{ env.EC2_HOST }} << 'INNER_EOF'
          set -euo pipefail
          runtime_secret_stage="/home/ubuntu/${{ inputs.ecr-repo }}.runtime-secrets-${{ github.run_id }}-${{ github.run_attempt }}"
          runtime_secret_manifest="${runtime_secret_stage}.manifest"
          test -d "$runtime_secret_stage"
          test ! -e "$runtime_secret_stage/.runtime-secrets"
          find "$runtime_secret_stage" -type f -printf '%P\n' | LC_ALL=C sort > "${runtime_secret_stage}.actual-manifest"
          cmp -s "$runtime_secret_manifest" "${runtime_secret_stage}.actual-manifest"
          rm -f "$runtime_secret_manifest" "${runtime_secret_stage}.actual-manifest"
            mkdir -p ${{ env.MAINNET_AWS_DEFAULT_DEPLOYMENT_PATH }}/${{ inputs.ecr-repo }}
            cd    ${{ env.MAINNET_AWS_DEFAULT_DEPLOYMENT_PATH }}/${{ inputs.ecr-repo }}
          mv /home/ubuntu/${{ inputs.ecr-repo }}.yml ./docker-compose.yml
          mv /home/ubuntu/${{ inputs.ecr-repo }}.env ./.env
          rm -rf ./.runtime-secrets
          mv "$runtime_secret_stage" ./.runtime-secrets
          chmod -R go-rwx ./.runtime-secrets
          sed -i '/image:/s|image:.*|image: ${{ secrets.ECR_REGISTRY }}/${{ inputs.ecr-repo }}:${{ github.sha }}|' docker-compose.yml
            export AWS_ACCESS_KEY_ID=${{env.AWS_ACCESS_KEY_ID}}
            export AWS_SECRET_ACCESS_KEY=${{env.AWS_SECRET_ACCESS_KEY}}
            export AWS_SESSION_TOKEN=${{env.AWS_SESSION_TOKEN}}
            export AWS_REGION=${{ inputs.ecr-repo-aws-region }}
            export AWS_DEFAULT_REGION=${{ inputs.ecr-repo-aws-region }}
          aws ecr get-login-password --region ${{ inputs.ecr-repo-aws-region }} \
            | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}
          docker compose down
          docker compose pull
          docker compose up -d
          INNER_EOF
          OUTER_EOF

      - name: Clean up local secret material
        if: ${{ always() }}
        run: rm -rf .env .runtime-secrets .runtime-secrets.manifest .secret-file-map.json

      - name: Clean up Docker credentials
        run: rm -f /home/runner/.docker/config.json
